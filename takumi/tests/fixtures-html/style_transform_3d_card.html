<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_transform_3d_card</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: space-around;
        background-image: linear-gradient(160deg, rgb(30, 30, 50), rgb(90, 70, 120));
        font-family: Geist;
      "
    >
      <div
        style="
          display: flex;
          flex-direction: column;
          width: 420px;
          height: 300px;
          padding: 24px;
          border-radius: 24px;
          background-image: linear-gradient(135deg, rgb(255, 255, 255), rgb(220, 230, 255));
          color: rgb(20, 20, 40);
          font-size: 32px;
          transform: perspective(1000px) rotateX(18deg) rotateY(-28deg) rotateZ(4deg);
        "
      >
        <img
          src="assets/images/yeecord.png"
          style="width: 120px; height: 120px; border-radius: 16px"
        />
        <span style="margin-top: 24px">Tilted card</span>
        <span style="font-size: 22px; opacity: 0.7">perspective · rotateX · rotateY</span>
      </div>
      <div
        style="
          display: flex;
          width: 360px;
          height: 360px;
          perspective: 600px;
          perspective-origin: 80% 20%;
        "
      >
        <div
          style="
            display: flex;
            align-items: flex-end;
            width: 360px;
            height: 360px;
            padding: 20px;
            background-image: url(&quot;assets/images/yeecord.png&quot;);
            background-size: cover;
            color: rgb(255, 255, 255);
            font-size: 28px;
            transform: rotate3d(1, 1, 0, 35deg);
            transform-origin: 50% 100%;
          "
        >
          rotate3d
        </div>
      </div>
    </div>
  </body>
</html>
