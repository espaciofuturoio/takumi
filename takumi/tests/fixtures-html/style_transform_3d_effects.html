<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_transform_3d_effects</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: space-around;
        background-color: rgb(240, 240, 240);
      "
    >
      <div
        style="
          display: flex;
          width: 260px;
          height: 300px;
          border-radius: 24px;
          background: linear-gradient(135deg, rgb(56, 189, 248), rgb(168, 85, 247));
          clip-path: inset(20px 30px round 40px);
          opacity: 0.6;
          transform: perspective(700px) rotateY(40deg);
        "
      ></div>
      <div
        style="
          display: flex;
          width: 260px;
          height: 300px;
          border: 12px solid rgb(15, 23, 42);
          background-color: rgb(250, 204, 21);
          filter: blur(3px);
          transform: perspective(700px) rotateX(35deg);
        "
      ></div>
      <div
        style="
          display: flex;
          width: 220px;
          height: 220px;
          overflow: hidden;
          border-radius: 30px;
          background-color: rgb(203, 213, 225);
          align-items: center;
          justify-content: center;
          perspective: 400px;
        "
      >
        <div
          style="
            display: flex;
            width: 200px;
            height: 200px;
            background: linear-gradient(rgb(244, 63, 94), rgb(34, 197, 94));
            transform: rotateY(-50deg) translateZ(60px);
          "
        ></div>
      </div>
    </div>
  </body>
</html>
