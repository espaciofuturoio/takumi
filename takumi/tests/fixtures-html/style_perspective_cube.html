<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>style_perspective_cube</title>
    <base href="../../../" />
    <link rel="stylesheet" href="takumi/tests/shared.css" />
    <style>
      .stage {
        position: relative;
        width: 240px;
        height: 240px;
        perspective: 700px;
        perspective-origin: 50% 40%;
      }
      .face {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 240px;
        height: 240px;
        color: rgb(255, 255, 255);
        font-size: 40px;
        font-family: Geist;
        border: 6px solid rgb(20, 20, 20);
        backface-visibility: hidden;
      }
    </style>
  </head>
  <body style="width: 1200px; height: 630px">
    <div
      style="
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: space-around;
        background-color: rgb(240, 240, 240);
      "
    >
      <div class="stage">
        <div
          class="face"
          style="background-color: rgb(0, 128, 255); transform: rotateY(-35deg) translateZ(120px)"
        >
          front
        </div>
        <div
          class="face"
          style="background-color: rgb(255, 128, 0); transform: rotateY(55deg) translateZ(120px)"
        >
          right
        </div>
        <div
          class="face"
          style="background-color: rgb(255, 0, 0); transform: rotateY(145deg) translateZ(120px)"
        >
          back
        </div>
        <div
          class="face"
          style="background-color: rgb(0, 160, 0); transform: rotateY(-125deg) translateZ(120px)"
        >
          left
        </div>
      </div>
      <div class="stage" style="perspective: 500px; perspective-origin: left top">
        <div
          class="face"
          style="
            background-color: rgb(128, 0, 255);
            transform: rotateX(25deg) rotateY(-20deg) translateZ(120px);
          "
        >
          top
        </div>
        <div
          class="face"
          style="
            background-color: rgb(0, 170, 170);
            transform: rotateX(25deg) rotateY(70deg) translateZ(120px);
          "
        >
          side
        </div>
        <div
          class="face"
          style="
            background-color: rgb(255, 0, 0);
            transform: rotateX(25deg) rotateY(160deg) translateZ(120px);
          "
        >
          back
        </div>
      </div>
    </div>
  </body>
</html>
