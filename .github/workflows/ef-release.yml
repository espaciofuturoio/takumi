name: EF Release

# Builds the espaciofuturo integration branch and publishes `v<upstream>-ef.<n>` as a GitHub
# Release whose tarballs install by URL (FORK.md "Release"). Runs on demand and from EF Sync.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to release
        default: espaciofuturo
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: ef-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  RUSTFLAGS: >-
    --remap-path-prefix=/home/runner=~
    --remap-path-prefix=/Users/runner=~
    --remap-path-prefix=/root=~
    --remap-path-prefix=$HOME/.cargo/registry=~/.cargo/registry
    --remap-path-prefix=$HOME/.rustup=~/.rustup

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - id: resolve
        run: |
          set -euo pipefail
          base=$(jq -r .version takumi-js/package.json)
          last=$(git tag -l "v${base}-ef.*" | sed -E 's/.*-ef\.([0-9]+)$/\1/' | sort -n | tail -1)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${base}-ef.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

  test-rust:
    name: Rust tests and goldens
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          stage: test

      - uses: ./.github/actions/setup-bun

      - name: Run tests
        run: cargo test --locked

      - name: Goldens unchanged
        run: |
          bunx oxfmt --write takumi/tests/fixtures-generated
          if ! git diff --quiet HEAD; then
            git diff --stat HEAD
            echo "::error::the test run changed committed goldens"
            exit 1
          fi

  build-helpers:
    name: Build @takumi-rs/helpers
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile --filter ./takumi-helpers
      - run: bun run build
        working-directory: takumi-helpers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist
          if-no-files-found: error

  build-napi:
    name: Build @takumi-rs/core for ${{ matrix.settings.target }}
    needs: [version, build-helpers]
    strategy:
      fail-fast: true
      matrix:
        settings:
          - host: macos-15
            target: aarch64-apple-darwin
            build: bun run build --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: bun run build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: bun run build --target x86_64-unknown-linux-musl -x
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-rust
        with:
          # upstream ci.yml pins the same nightly for size
          toolchain: nightly-2026-08-05
          targets: ${{ matrix.settings.target }}
          components: rust-src
          stage: build
      - name: Install cargo-zigbuild
        if: contains(matrix.settings.target, 'musl')
        run: pip install cargo-zigbuild
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist
      - run: bun install --frozen-lockfile --filter ./takumi-napi
      - name: Build
        working-directory: takumi-napi
        env:
          CARGO_UNSTABLE_BUILD_STD: std
          CARGO_UNSTABLE_BUILD_STD_FEATURES: optimize_for_size
          CARGO_PROFILE_RELEASE_PANIC: unwind
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -Zunstable-options
        run: ${{ matrix.settings.build }} -- --locked && bun build:js
      - name: Test bindings
        if: ${{ !contains(matrix.settings.target, 'musl') }}
        working-directory: takumi-napi
        run: bun test
      - name: Test bindings in Alpine (musl)
        if: contains(matrix.settings.target, 'musl')
        run: |
          docker run --rm -v $PWD:/workspace -w /workspace/takumi-napi \
            oven/bun:alpine bun test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            takumi-napi/dist
            takumi-napi/core.*.node
            takumi-napi/index.js
            takumi-napi/index.d.ts
          if-no-files-found: error

  build-wasm:
    name: Build @takumi-rs/wasm
    needs: [version, build-helpers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly-2026-08-05
          targets: wasm32-unknown-unknown
          components: rust-src
          stage: build
      - uses: ./.github/actions/setup-wasm-pack
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist
      - run: bun install --frozen-lockfile --filter ./takumi-wasm
      - name: Build WASM
        working-directory: takumi-wasm
        env:
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort
          CARGO_UNSTABLE_BUILD_STD_FEATURES: optimize_for_size
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -Zunstable-options -Cpanic=immediate-abort -Ctarget-feature=+simd128
        run: bun run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-package
          path: |
            takumi-wasm/pkg
            takumi-wasm/dist
          if-no-files-found: error

  package:
    name: Build takumi-js and pack
    needs: [version, test-rust, build-helpers, build-napi, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helpers-dist
          path: takumi-helpers/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bindings-*
          path: takumi-napi
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package
          path: takumi-wasm
      - run: bun install --frozen-lockfile --filter ./takumi-js
      - run: bun run build
        working-directory: takumi-js
      - run: bun scripts/ef-pack.ts --version "${{ needs.version.outputs.version }}" --out dist-ef --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ef-tarballs
          path: dist-ef/*.tgz
          if-no-files-found: error

  publish:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ef-tarballs
          path: dist-ef
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          cat > notes.md <<EOF
          espaciofuturo build of takumi at \`${SHA}\` (upstream master plus the patches in FORK.md).

          Install (bun):

          \`\`\`json
          "takumi-js": "${url}/takumi-js-${VERSION}.tgz"
          \`\`\`

          \`@takumi-rs/core\` carries the darwin-arm64, linux-x64-gnu and linux-x64-musl binaries.
          EOF
          gh release create "v${VERSION}" dist-ef/*.tgz --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" --title "v${VERSION}" --notes-file notes.md --prerelease

  smoke:
    name: Smoke ${{ matrix.name }}
    needs: [version, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            host: macos-15
          - name: linux-x64-gnu
            host: ubuntu-latest
          - name: linux-x64-musl
            host: ubuntu-latest
            alpine: true
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ef-smoke
            .github/actions
      - uses: ./.github/actions/setup-bun
        if: ${{ !matrix.alpine }}
      - name: Install from the release and render
        env:
          URL: https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}/takumi-js-${{ needs.version.outputs.version }}.tgz
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/smoke"
          mkdir -p "$dir" && cp scripts/ef-smoke/smoke.ts "$dir/"
          echo '{"name":"ef-smoke","private":true,"type":"module"}' > "$dir/package.json"
          if [ "${{ matrix.alpine }}" = "true" ]; then
            docker run --rm -v "$dir:/smoke" -w /smoke oven/bun:1.4.2-alpine sh -c "bun add '$URL' && bun smoke.ts"
          else
            cd "$dir" && bun add "$URL" && bun smoke.ts
          fi

  mark-broken:
    name: Mark release broken
    needs: [version, smoke]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --title "v${VERSION} (BROKEN: smoke failed, do not install)" || true
